services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: portfoliodb
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --performance-schema=OFF
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-net

  app:
    build: .
    container_name: dotnet_app
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=portfoliodb;Uid=root;Pwd=${DB_PASSWORD};CharSet=utf8mb4;
      - Seed__SampleData=true
      - Jwt__Key=${JWT_KEY}
      - Admin__Email=${ADMIN_EMAIL}
      - Admin__Password=${ADMIN_PASSWORD}
      # Formulário de contato
      - Smtp__Host=${SMTP_HOST}
      - Smtp__User=${SMTP_USER}
      - Smtp__Password=${SMTP_PASSWORD}
      - Smtp__From=${SMTP_FROM}
      - Smtp__NotifyTo=${SMTP_NOTIFY_TO}
    volumes:
      - app_uploads:/app/wwwroot/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net

  caddy:
    image: caddy:latest
    container_name: caddy_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - app-net

volumes:
  mysql_data:
  app_uploads:
  caddy_data:
  caddy_config:

networks:
  app-net:
    driver: bridge
